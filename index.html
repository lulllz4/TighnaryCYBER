<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Тигнари — анкета</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500&family=IBM+Plex+Mono:wght@400;500&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#010504; --ink:#cfe3dc; --dim:#6a837b;
  --mint:#9ff5d6; --mint-d:rgba(159,245,214,.26);
  --uv:#e03bff; --uv-d:rgba(224,59,255,.32);
  --f-head:"Oswald","Arial Narrow",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --f-hand:"Caveat","Segoe Print",cursive;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#010504; --ink:#cfe3dc; --dim:#6a837b; } }
:root[data-theme="dark"]{ --bg:#010504; --ink:#cfe3dc; --dim:#6a837b; }
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-mono);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:1px solid var(--mint);outline-offset:3px}

#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
#stage.hov canvas{cursor:pointer}

/* передний план не в фокусе */
#fg{position:fixed;inset:-8%;pointer-events:none;z-index:3;will-change:transform;transition:opacity 1.2s}
#fg canvas{position:absolute;filter:blur(9px)}
#fg .fa{left:0;top:0;width:40%;transform-origin:0 0;animation:swa 11s ease-in-out infinite}
#fg .fb{right:0;top:0;height:92%;transform-origin:100% 0;animation:swb 13s ease-in-out infinite}
#fg .fc{left:18%;top:0;width:70%;filter:blur(1.6px);opacity:.75}
@keyframes swa{50%{transform:rotate(1.4deg)}}
@keyframes swb{50%{transform:rotate(-1.1deg)}}

/* метки */
#tags{position:fixed;inset:0;pointer-events:none;z-index:4}
.tg{position:absolute;left:0;top:0;opacity:0;transition:opacity .25s;will-change:transform}
.tg.show{opacity:1}
.tg i{position:absolute;left:-3px;top:-3px;width:6px;height:6px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c)}
.tg s{position:absolute;left:0;top:0;width:40px;height:1px;background:linear-gradient(90deg,var(--c),transparent);transform-origin:0 0;transform:rotate(-35deg)}
.tg div{position:absolute;left:32px;top:-46px;white-space:nowrap;font-size:11px;letter-spacing:.2em;color:var(--c);text-shadow:0 0 8px #000,0 0 2px #000}
.tg small{display:block;margin-top:3px;font-size:11px;letter-spacing:.04em;color:var(--dim)}
.tg.left s{transform:rotate(-145deg)}
.tg.left div{left:auto;right:32px;text-align:right}
.tg.done small{color:var(--mint)}

/* HUD */
.hud{position:fixed;left:0;right:0;top:0;z-index:7;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:calc(env(safe-area-inset-top,0px) + 16px) 18px 0;pointer-events:none}
.hud>*{pointer-events:auto}
.where{font-size:11px;letter-spacing:.34em;color:var(--dim)}
.prog{margin-top:10px;display:flex;align-items:center;gap:10px;font-size:11px;color:var(--dim)}
.dots{display:flex;gap:6px}
.dots span{width:6px;height:6px;border-radius:50%;border:1px solid var(--mint-d);transition:background .6s,box-shadow .6s}
.dots span.on{background:var(--mint);box-shadow:0 0 8px var(--mint)}
.hud-btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.hbtn{font-size:11px;letter-spacing:.16em;padding:8px 12px;background:rgba(1,6,5,.5);border:1px solid var(--mint-d);color:var(--dim);cursor:pointer;transition:color .2s,border-color .2s,box-shadow .2s}
.hbtn:hover{color:var(--ink);border-color:var(--mint)}
.hbtn.on{color:var(--ink);border-color:var(--mint)}
.hbtn.uv.on{color:#f6d8ff;border-color:var(--uv);box-shadow:inset 0 0 16px var(--uv-d),0 0 12px var(--uv-d)}
.hbtn kbd{font:inherit;opacity:.55;margin-left:6px}
.hint{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);transform:translateX(-50%);z-index:7;font-size:12px;letter-spacing:.04em;color:var(--dim);text-align:center;width:min(560px,calc(100% - 32px));text-shadow:0 0 8px #000;transition:opacity 1s;pointer-events:none}
.hint.gone{opacity:0}
@media (max-width:600px){.hbtn kbd,.close kbd{display:none}.hbtn{padding:7px 9px;letter-spacing:.1em}}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 64px);transform:translate(-50%,10px);z-index:30;max-width:calc(100% - 32px);font-size:13px;color:var(--ink);background:rgba(1,6,5,.82);border:1px solid var(--mint-d);padding:10px 16px;opacity:0;pointer-events:none;transition:opacity .4s,transform .4s}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* вход */
#enter{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 60%,rgba(1,8,6,.82),#000 70%);transition:opacity 1.6s}
#enter.gone{opacity:0;pointer-events:none}
.en-in{display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center;padding:24px}
.en-k{margin:0;font-size:11px;letter-spacing:.5em;color:var(--dim)}
.en-t{margin:0;font-family:var(--f-head);font-weight:300;font-size:clamp(26px,5vw,40px);letter-spacing:.12em;color:var(--ink)}
.en-s{margin:0;font-size:12px;color:var(--dim);max-width:34ch;line-height:1.6}
#enBtn{margin-top:8px;font-size:12px;letter-spacing:.4em;padding:14px 34px 14px 38px;background:none;border:1px solid var(--mint-d);color:var(--ink);cursor:pointer;transition:border-color .3s,box-shadow .3s}
#enBtn:hover{border-color:var(--mint);box-shadow:0 0 22px rgba(159,245,214,.14)}
#enMute{background:none;border:0;color:var(--dim);font-size:12px;cursor:pointer;text-decoration:underline;text-underline-offset:4px}
#enMute:hover{color:var(--ink)}
#fail{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:24px;text-align:center;background:#000;color:var(--dim)}
#fail.on{display:flex}

/* панель у предмета */
.fhud{position:fixed;left:18px;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);z-index:8;width:min(360px,calc(100% - 36px));padding:14px 16px 12px;background:linear-gradient(180deg,rgba(1,7,6,.8),rgba(1,4,3,.88));border-left:1px solid var(--mint);box-shadow:0 0 40px rgba(0,0,0,.6);opacity:0;transform:translateY(12px);pointer-events:none;transition:opacity .5s,transform .5s}
.fhud.open{opacity:1;transform:none;pointer-events:auto}
.fh-t{display:block;font-family:var(--f-head);font-weight:300;font-size:20px;letter-spacing:.22em;color:var(--ink)}
.fh-screen{margin-top:10px;font-size:12px;letter-spacing:.14em;color:var(--mint);display:none}
.fh-screen.on{display:block}
.fh-screen.err{color:#f2b8ff;text-shadow:0 0 10px var(--uv);animation:jit .1s steps(2) 6}
.fh-screen.gl{color:var(--dim);animation:jit .14s steps(2) infinite}
.fh-screen.ok{color:var(--mint)}
@keyframes jit{50%{transform:translateX(2px);opacity:.6}}
.fh-ctrl{margin-top:12px;display:flex;flex-direction:column;gap:10px}
.fh-ctrl:empty{display:none}
.act{font-size:11px;letter-spacing:.24em;padding:12px 14px;background:none;border:1px solid var(--mint-d);color:var(--ink);cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:none;transition:border-color .2s,background .2s}
.act:hover:not(:disabled){border-color:var(--mint)}
.act:disabled{opacity:.3;cursor:default}
.act.active{border-color:var(--uv);background:rgba(224,59,255,.14)}
.heat{display:flex;align-items:center;gap:12px}
.temp{font-size:15px;min-width:60px}
.gauge{flex:1;height:4px;position:relative;background:rgba(159,245,214,.1)}
.gauge .zone{position:absolute;top:-4px;bottom:-4px;left:62%;width:18%;border-left:1px solid var(--mint);border-right:1px solid var(--mint);background:rgba(159,245,214,.08)}
.gauge .fill{position:absolute;inset:0;background:linear-gradient(90deg,#1c5a46,var(--mint) 60%,var(--uv));clip-path:inset(0 100% 0 0)}
.dials{display:flex;gap:6px;justify-content:center}
.dial{display:flex;flex-direction:column;align-items:center;width:42px;border:1px solid var(--mint-d)}
.dial button{background:none;border:0;color:var(--dim);font-size:11px;padding:7px 0;width:100%;cursor:pointer}
.dial button:hover{color:var(--ink)}
.dial span{font-size:22px;color:var(--ink);line-height:1.1}
.dials.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
.fh-msg{margin-top:10px;font-size:12px;line-height:1.5;color:var(--dim);min-height:1.3em}
.fh-msg.ok{color:var(--mint)}
.fh-msg.bad{color:#f2b8ff}
.fh-foot{margin-top:10px;display:flex;justify-content:space-between;align-items:center}
.ghost{font-size:11px;letter-spacing:.18em;background:none;border:0;color:var(--dim);padding:6px 0;cursor:pointer}
.ghost:hover{color:var(--ink)}
.skip{background:none;border:0;color:var(--dim);font-size:11px;cursor:pointer;opacity:.7;text-decoration:underline;text-underline-offset:3px}
.skip:hover{opacity:1;color:var(--ink)}

/* окно с текстом */
.modal{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px);background:rgba(0,3,2,.76);backdrop-filter:blur(6px) saturate(.5);-webkit-backdrop-filter:blur(6px) saturate(.5);opacity:0;pointer-events:none;transition:opacity .6s}
.modal.open{opacity:1;pointer-events:auto}
.panel{position:relative;width:min(900px,100%);max-height:100%;display:flex;flex-direction:column;background:linear-gradient(180deg,rgba(3,12,10,.96),rgba(1,4,3,.98));border:1px solid var(--mint-d);box-shadow:0 30px 80px rgba(0,0,0,.7);transform:translateY(12px);transition:transform .6s cubic-bezier(.2,.8,.3,1)}
.panel::before{content:"";position:absolute;left:-1px;top:24px;width:2px;height:48px;background:var(--uv);box-shadow:0 0 12px var(--uv)}
.modal.open .panel{transform:none}
.ph{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 22px 14px 24px;border-bottom:1px solid rgba(159,245,214,.12)}
.ph-k{display:block;font-size:11px;letter-spacing:.2em;color:var(--dim)}
.ph-t{display:block;margin-top:3px;font-size:12px;letter-spacing:.24em;color:var(--mint)}
.close{flex:none;font-size:11px;letter-spacing:.18em;background:none;border:1px solid var(--mint-d);color:var(--ink);padding:8px 12px;cursor:pointer}
.close:hover{border-color:var(--mint)}
.close kbd{font:inherit;opacity:.5;margin-left:6px}
.pb{flex:1;min-height:0;overflow:auto;padding:22px 24px 26px}
.content{animation:fadeIn 1s ease}
@keyframes fadeIn{0%{opacity:0;filter:blur(6px);transform:translateY(6px)}100%{opacity:1;filter:none;transform:none}}
.c-head{margin-bottom:22px}
.c-head h2{margin:0;font-family:var(--f-head);font-weight:300;font-size:clamp(32px,5.4vw,56px);line-height:1.02;letter-spacing:.08em;text-transform:uppercase;color:#e7f1ec}
.c-sub{display:block;margin-top:8px;font-size:12px;letter-spacing:.06em;color:var(--dim)}
.c-body.prose{max-width:64ch}
.c-body p{font-size:15px;line-height:1.8;margin:0 0 1.1em;color:#c7d8d1}
.phd,.c-body p.phd{color:var(--dim);font-style:italic}
.dossier{display:grid;grid-template-columns:minmax(150px,220px) 1fr;gap:22px 32px;align-items:start}
.d-card img{display:block;width:100%;height:auto;box-shadow:0 16px 30px rgba(0,0,0,.8);filter:saturate(.7) brightness(.85)}
.d-fields{display:grid;gap:20px}
.d-field label{display:block;font-size:11px;letter-spacing:.28em;color:var(--dim);margin-bottom:6px}
.d-field .val{font-size:18px;line-height:1.5}
.d-field .val p{margin:0 0 .5em}
@media (max-width:620px){.dossier{grid-template-columns:1fr}.d-card{max-width:220px}}
.imp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.imp{padding:14px 16px 12px;border-top:1px solid var(--mint-d)}
.imp-slot{font-size:11px;letter-spacing:.2em;color:var(--dim)}
.imp-name{font-family:var(--f-head);font-weight:400;font-size:18px;letter-spacing:.1em;text-transform:uppercase;margin:6px 0 8px;color:#e7f1ec}
.imp-text p{font-size:14px;line-height:1.65;margin:0 0 .6em;color:#c7d8d1}
.jbook{max-width:540px;margin:0 auto}
.jpage{position:relative;min-height:320px;padding:26px 26px 26px 66px;color:#121614;font-family:var(--f-hand);font-size:26px;line-height:32px;background-color:#8f9a8f;background-image:linear-gradient(90deg,transparent 48px,rgba(120,30,60,.4) 48px 50px,transparent 50px),repeating-linear-gradient(180deg,transparent 0 31px,rgba(20,40,40,.22) 31px 32px),radial-gradient(circle at 84% 84%,transparent 26px,rgba(30,40,20,.3) 27px 31px,transparent 32px),radial-gradient(ellipse at 20% 90%,rgba(20,30,15,.3),transparent 40%),radial-gradient(ellipse at 90% 10%,rgba(0,0,0,.3),transparent 45%);background-position:0 0,0 18px,0 0,0 0,0 0;box-shadow:inset 0 0 60px rgba(10,25,20,.55),0 18px 36px rgba(0,0,0,.8);transform:rotate(-.6deg)}
.jpage p{margin:0 0 32px}
.jpage p.phd{color:#3f4a46}
.jpage.turn{animation:turn .5s ease}
@keyframes turn{0%{opacity:0;transform:rotate(-.6deg) translateX(20px)}100%{opacity:1;transform:rotate(-.6deg)}}
.p-num{position:absolute;right:18px;top:8px;font-family:var(--f-mono);font-size:11px;color:#3c463f}
.jnav{display:flex;justify-content:space-between;align-items:center;margin-top:18px}
.jnav button{font-size:11px;letter-spacing:.18em;background:none;border:1px solid var(--mint-d);color:var(--ink);padding:9px 14px;cursor:pointer}
.jnav button:disabled{opacity:.25;cursor:default}
.jnav span{font-size:12px;color:var(--dim)}
.holo-wrap{display:flex;flex-direction:column;align-items:center}
.holo{position:relative;width:min(360px,100%);aspect-ratio:3/4;border:1px solid var(--mint-d);background:radial-gradient(ellipse at 50% 100%,rgba(159,245,214,.12),transparent 70%),#010605;overflow:hidden;animation:holoOn 1.4s steps(1)}
.holo img{display:block;width:100%;height:100%;object-fit:cover;filter:saturate(.75) contrast(1.05)}
.holo::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(180deg,rgba(159,245,214,.07) 0 1px,transparent 1px 4px);mix-blend-mode:screen}
@keyframes holoOn{0%{opacity:0}14%{opacity:.6}24%{opacity:.1}40%{opacity:1}55%{opacity:.4}70%,100%{opacity:1}}
.holo-empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px}
.holo-empty b{font-family:var(--f-head);font-weight:300;font-size:20px;letter-spacing:.24em;color:var(--mint)}
.holo-empty span{font-size:12px;color:var(--dim)}
.holo-cap{margin-top:14px;font-size:13px;color:var(--dim);text-align:center;max-width:46ch}
.holo-link{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center}
.hl-k{font-size:11px;letter-spacing:.32em;color:var(--dim)}
.hl-a{font-family:var(--f-head);font-weight:300;font-size:clamp(22px,6vw,32px);letter-spacing:.12em;color:var(--mint);text-decoration:none;border:1px solid var(--mint-d);padding:14px 20px;word-break:break-all;text-shadow:0 0 12px rgba(159,245,214,.5);transition:border-color .25s,box-shadow .25s,color .25s}
.hl-a[href]:hover{color:#e7fff6;border-color:var(--mint);box-shadow:0 0 24px rgba(159,245,214,.2),inset 0 0 16px rgba(159,245,214,.08)}
.hl-s{font-size:12px;color:var(--dim)}
.note{max-width:440px;margin:8px auto 0;padding:30px 30px 34px;color:#121614;font-family:var(--f-hand);font-size:27px;line-height:1.3;transform:rotate(-1.4deg);background-color:#8f9a8f;background-image:linear-gradient(180deg,transparent 49%,rgba(0,0,0,.14) 50%,transparent 51%),radial-gradient(ellipse at 80% 20%,rgba(80,10,40,.28),transparent 35%),radial-gradient(ellipse at 15% 85%,rgba(20,30,15,.35),transparent 40%);box-shadow:inset 0 0 50px rgba(10,25,20,.5),0 18px 36px rgba(0,0,0,.8)}
.note p{margin:0 0 .6em}
.note p.phd{color:#3f4a46}
@media (prefers-reduced-motion: reduce){ #fg canvas{animation:none!important} .content{animation:none} }
</style>
</head>
<body>
<div id="enter"><div class="en-in">
  <p class="en-k">ПОДВАЛ</p>
  <p class="en-t">Рекомендованы наушники.</p>
  <p class="en-s">Двигайте мышью, чтобы осмотреться</p>
  <button id="enBtn">ВОЙТИ</button>
  <button id="enMute">войти без звука</button>
</div></div>
<div id="fail">Этот браузер не смог запустить 3D-сцену. Попробуй открыть страницу в свежем Chrome, Firefox или Safari.</div>
<div id="stage"></div>
<div id="fg"><canvas class="fa" width="560" height="460"></canvas><canvas class="fb" width="300" height="760"></canvas><canvas class="fc" width="900" height="200"></canvas></div>
<div id="tags"></div>

<header class="hud">
  <div>
    <div class="where">ПОДВАЛ</div>
    <div class="prog"><span class="dots" id="dots"><span></span><span></span><span></span><span></span><span></span><span></span></span><span id="progTxt">0 из 6</span></div>
  </div>
  <div class="hud-btns">
    <button class="hbtn uv" id="uvBtn" aria-pressed="false">УФ<kbd>F</kbd></button>
    <button class="hbtn" id="motBtn" aria-pressed="true">ДВИЖЕНИЕ</button>
    <button class="hbtn" id="soundBtn" aria-pressed="false">ЗВУК</button>
  </div>
</header>
<div class="hint" id="hint">Двигайте мышью, чтобы осмотреться. Кликайте по предметам. F включает ультрафиолет.</div>
<div id="toast" role="status" aria-live="polite"></div>

<div class="fhud" id="fhud" aria-hidden="true">
  <span class="fh-t" id="fhTitle"></span>
  <div class="fh-screen" id="fhScreen"></div>
  <div class="fh-ctrl" id="fhCtrl"></div>
  <div class="fh-msg" id="fhMsg"></div>
  <div class="fh-foot"><button class="ghost" id="fhBack">‹ ВЫПРЯМИТЬСЯ</button><button class="skip" id="fhSkip">Пропустить</button></div>
</div>

<div id="modal" class="modal" aria-hidden="true">
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <div class="ph">
      <div><span class="ph-k" id="mKicker"></span><span class="ph-t" id="mTitle"></span></div>
      <button class="close" id="mClose">ЗАКРЫТЬ<kbd>Esc</kbd></button>
    </div>
    <div class="pb" id="mBody"></div>
  </div>
</div>

<script>
/* =========================================================
   АНКЕТА
   ========================================================= */
window.ANKETA = {
  name: "Тигнари Сааде",
  age: "35",
  role: "Подпольный химик. Кукер.",

  character: "Терпение — черта характера, напрочь позабытая в нынешних реалиях. Но в Тигнари оно выражено ярче всего и первым бросается в глаза. Если повезёт застать его за работой, увидишь неторопливость движений и сосредоточенную тишину. Пальцы касаются мицелия бережно, будто боятся разбудить. Влажность проверяется дважды, температура — трижды. От внимания не ускользает ни одна мелочь: пятно плесени не того оттенка, едва заметная сухость на краю субстрата, лишний градус на датчике. В такие минуты в подвале становится почти уютно. Фитолампы льют мягкий свет, пахнет сырой землёй, и кажется, что наверху нет никакого города, похожего на ад.\n\nМир для Тигнари — это система, которую можно разобрать на части. У всего есть причина, за ней тянется следствие, и цепочку между ними всегда можно проследить до конца. Его мысль работает быстро и чисто, как скальпель: отсекает лишнее, находит закономерность в хаосе, связывает разрозненные факты в единую картину. Чужая небрежность раздражает почти физически: криво наклеенный ярлык на пробирке, округлённая «на глаз» цифра, расслабленное «ну, примерно так». В его голове приблизительности не существует. Со временем эта точность переросла в манию. Теперь инструменты должны лежать строго параллельно краю стола, страница с одной дрогнувшей буквой переписывается заново, а единственная неучтённая переменная способна отравить весь день.\n\nИз этой педантичности выросло убеждение, о котором Тигнари молчит лишь потому, что считает его аксиомой: ценность человека определяется его интеллектом. Остальное вторично. Доброта, сила, обаяние, верность хороши ровно настолько, насколько ими управляет холодный рассудок; без него они превращаются в белый шум. Мир выстроен в строгую иерархию, и большинство людей топчется где-то у самого подножия. Себе же Тигнари отводит место почти на вершине — и «почти» здесь только из формальной скромности.\n\nВслух это превосходство сочится тонким, будничным ядом. Никакого крика или прямых оскорблений. Зачем повышать голос, если можно поправить ударение в чужом слове, переспросить с вежливым недоумением или разжевать простую истину так медленно и терпеливо, словно перед тобой пятилетний ребёнок? Хватает пары минут такой беседы, чтобы собеседник почувствовал себя неуклюжим, грязным и тупым. Когда-то эта колкость служила бронёй. Теперь защищаться не от чего, но привычка пустила корни и срослась с кожей.\n\nЛюди в его системе координат делятся не на хороших и плохих, а на функциональных и бесполезных. Один покупает, другой поставляет сырьё, третий знает нужные имена. Каждому знакомому негласно присвоен ценник, который может обнулиться в любую секунду. Привязанность — это уязвимость, которую в Найт-Сити нащупывают и бьют по ней без жалости, а доверие — непозволительная роскошь для тех, кто ещё не успел за неё поплатиться. Друзей у Тигнари нет. Есть только контакты, долги и неизбежность.\n\nИ всё же что-то от прежней бережности в нём осталось, пусть и вывернутое наизнанку. Руки, помнящие тонкую работу, просто не умеют делать плохо. Если на порог приползёт пацан с распоротым боком, Тигнари промоет рану и наложит ровные, ювелирные швы, параллельно сквозь зубы читая лекцию о непроходимой тупости. А тем же вечером этот же пацан получит из его рук пакетик с веществом, которое остановит сердце. И сам поставщик не увидит здесь ни противоречия, ни злой иронии. Первое — качественно сделанная работа. Второе — тоже.\n\nНовые формулы нужно на ком-то тестировать, и в расход идут те, кого никто не хватится. Бездомные с окраин Пасифики, мусорщики, уличные подростки, готовые за горсть эдди проглотить любую дрянь. Процедура отработана до зевоты: дозировка, время приёма, первичная реакция, пик, продолжительность. Иногда в последней графе появляется сухая приписка: «Наблюдение прекращено по естественным причинам». На местном языке это называется полевыми данными.\n\nСам Тигнари употребляет не от душевной боли, тоски или безысходности — хотя легко скормтт любую из этих версий, если потребуется оправдание. Правда куда прозаичнее: ему нравится. Под стимуляторами мир обретает звенящую резкость и прозрачность, мысли несутся без остановки, нейронные связи вспыхивают сверхновыми, а каждая идея кажется откровением. В такие часы он почти счастлив: говорит взахлёб, перескакивает с темы на тему, громоздит сложные синтаксические конструкции и искренне упивается собственной гениальностью. Отходняк же превращает его в жалкую карикатуру. Он остаётся всё таким же жалким и невыносимым, но уже без ореола триумфа и чувства превосходства. По крайней мере, физически.\n\nОднако самое изящное, что создал его блестящий ум, — не химическая формула, а архитектура самообмана. На лабораторном столе лежит журнал, куда заносится всё: даты, дозировки, вещества, пульс, побочные эффекты. Это его главный фетиш, иллюзия контроля. Торчки не ведут статистику, торчки просто ширяются в подворотнях, а у него — исследование! Методология! В журнале даже есть свод правил, и у каждого своя история падения. Запрет «никогда до полудня» продержался пару месяцев, затем мутировал в «никогда до завтрака», а позже сжался до «никогда перед синтезом». Каждое сорванное ограничение тут же бережно перекрывается новой, более гибкой формулировкой.\n\nСобственную биографию он тоже давно отредактировал. Для редких слушателей у Тигнари заготовлена выверенная версия прошлого: гордая, принципиальная, полная красивых слов о чести и бескомпромиссности. Эта легенда повторялась так часто, что отшлифовалась до блеска и почти вытеснила правду. Его гордыня просто не оставляет места для реальности, в которой падение было унизительным, будничным и целиком по его собственной вине.\n\nСвоих клиентов он искренне презирает. Биомасса. Нарики, которые не отличат чистый продукт от дешёвого растворителя и сдохнут в канаве, так и не поняв, что именно сожгло им вены. Слабые, безвольные животные. С ними можно вести дела, но стоять на одной ступени — никогда. Тот факт, что к концу смены у него самого предательски дрожат пальцы, зрачки почти не реагируют на свет, а графики в журнале с каждой неделей ползут в критическую зону, старательно выносится за скобки. Он не такой. Он — учёный.\n\nТигнари не боится банд, шальной пули в затылок или смерти, с которой давно перешёл на «ты». Его главный, липкий кошмар — отупеть. Остаться с выжженными синапсами, медленным, вязким сознанием, неспособным удержать сложную мысль. Стать одним из тех пускающих слюни торчков, что ежедневно скребутся в его дверь. Иногда, в редкие часы абсолютной трезвости, он открывает свои старые научные статьи и не может преодолеть даже первый абзац: текст рассыпается на буквы, логика ускользает, и в голове не укладывается, как он вообще мог такое написать. В эти секунды к горлу подкатывает тошнотворный, первобытный ужас. Но лучшее лекарство от него стоит на полке в двух шагах — и порочный круг смыкается вновь.\n\nА потом наступает утро, и Тигнари возвращается к стеллажам. Проверяет влажность — дважды, температуру — трижды. Касается мицелия кончиками пальцев, словно боится разбудить. Наверху гудит проклятый город, а где-то в глубине этой светлой, неумолимо гибнущей головы теплится непоколебимая уверенность: всё под контролем. Ещё немного. Ещё одна удачная партия — и он обязательно выберется.",

  biography: "Интеллект был единственным капиталом, с которым Тигнари пришёл в этот мир. Ни денег, ни связей, ни громкой фамилии — только тесная бетонная клетка на окраине Хейвуда, бесконечная ругань за картонными стенами и голова, соображавшая быстрее, чем у кого-либо в квартале. Учителя раскусили это рано, уличная шпана — ещё раньше, и далеко не всегда гениальность шла на пользу.\n\nКорпоративная стипендия стала первым настоящим билетом наверх. Общая биология, генетика, затем ботаника и микология — предсказуемые живые системы, которые подчиняются строгим законам, а не слепым эмоциям. Работы молодого самородка начали цитировать, на закрытых симпозиумах к нему стали подходить люди в дорогих костюмах, и в итоге Biotechnica выкупила его с потрохами ещё до защиты диплома. Отдел синтетических культур, собственная лаборатория, платиновая медстраховка, о какой в его родном Хейвуде даже не слышали.\n\nТе годы Тигнари до сих пор лелеет в памяти как главное доказательство того, кем он является на самом деле. Просторные апартаменты, брендовая одежда, закрытые клиники. «Лисьи уши» появились именно тогда — капризная, баснословно дорогая модификация, вызывающий жест человека, который наконец-то может позволить себе выглядеть так, как вздумается. Корпорация закрыла на это глаза: ценному активу охотно прощались мелкие капризы.\n\nСтимуляторы вошли в жизнь рука об руку с горящими дедлайнами. Сначала — абсолютно легальные, выписанные штатным психотерапевтом, чтобы выдерживать двадцатичасовые смены в лаборатории. Но очень скоро выяснилось, что дело вовсе не в усталости. Под химией мысли становились такими бритвенно-острыми и стремительными, что обычная трезвость начала казаться отупением, почти инвалидностью. Дальше всё покатилось по наклонной: взломанный личный детоксикатор, первые прекурсоры, вынесенные из хранилища в кармане халата, первые кустарные партии, сваренные на казённом оборудовании глубокой ночью, когда сектор пустел. Сначала — исключительно для себя. Потом — на продажу, потому что аппетиты росли куда быстрее корпоративных бонусов.\n\nКрах оказался до обидного будничным. Никакого громкого разоблачения или красивой драмы. Просто однажды грань между рабочей сменой и затяжным трипом окончательно стёрлась, и последствия этого срыва беспристрастно зафиксировали камеры наблюдения, датчики и шокированные коллеги. Внутренняя безопасность Biotechnica потратила на разбирательство меньше суток. Уровни доступа обнулили, премиальные корпоративные импланты принудительно изъяли, страховку аннулировали, а память хирургически вычистили от всего, что компания сочла своим. За порогом небоскрёба остались только неподъёмные штрафы, ломка и обрывки формул, которые так и не смогли выскоблить из головы до конца.\n\nПадение на дно было стремительным. Апартаменты пришлось освободить, гардероб — распродать за бесценок, а вскоре под нож риппера пошли и остатки гражданского хрома. Сырой и дешёвый подвал в Пасифике подвернулся почти случайно, как и местная банда, которой позарез требовался толковый варщик, способный делать дурь чище, чем у конкурентов. Условия продиктовали они сами: расчёт частично собственным товаром, искусственно раздутый долг, растущий быстрее процентов по кредиту, и прозрачный, понятный без слов намёк на то, что с ним сделают, когда издержки перевесят выгоду.\n\nСвои грибы Тигнари унёс с собой. Точнее, несколько уникальных штаммов, чудом спасённых из корпоративной лаборатории в пробирках, которые он спрятал в распоротой подкладке куртки.\n\nНо всем, кто осмеливается спрашивать о прошлом, Тигнари скармливает совсем другую версию. В ней гениальный молодой учёный ужаснулся тому, в какое оружие корпорация превращает его детище, и гордо хлопнул дверью, отказавшись работать на бездушных мясников. История звучит благородно, принципиально, и с каждым новым пересказом в ней остаётся всё меньше белых ниток.\n\nЗабавно, что в эту сказку не верит почти никто.",

  implants: [
    { name: "Слуховой биомод («лисьи уши»)", text: "Экзотическая модификация, установленная в элитной клинике в те времена, когда деньги казались бесконечными. Сверхчуткий слух позволял вычленить один-единственный голос из гула толпы, определить частоту работы чужого импланта, услышать осторожные шаги этажом выше. Мод создавался как статусная игрушка — демонстрация утончённого вкуса и достатка.\n\nБез должного обслуживания эта роскошь медленно гниёт заживо. Искусственный мех вытерся до проплешин, обнажая грубые швы и потемневшие контакты, местами тронутые зеленью окисления. Частотный фильтр, призванный отсекать белый шум, давно работает через раз: теперь Найт-Сити врывается в голову по собственному желанию — воем сирен, агрессивной рекламой, гулом вентиляции и тысячами чужих голосов за бетонными стенами. Нейросоединение левого уха коротит, заставляя его судорожно дёргаться без видимой причины. Но хуже всего — фантомные шумы: навязчивый писк на грани ультразвука и обрывки шорохов, которых нет на самом деле. Полноценная калибровка стоит слишком дорого, поэтому какофонию в голове приходится глушить тем, что всегда под рукой." },
    { name: "Оптика", text: "Устаревшая лабораторная модель Kiroshi. Родную корпоративную прошивку пришлось выжечь — на её место встала ломаная пиратская сборка от подпольного риппера из Пасифики. Чудом уцелел главный инструмент — аналитический оверлей: спектральный анализ, оценка чистоты продукта по преломлению света и структуре кристаллов, макрозум, позволяющий разглядеть отдельные споры на срезе мицелия. В подвальной лаборатории этим глазам нет цены.\n\nРасплачиваться приходится постоянными глитчами. Интерфейс нервно мерцает, по краю поля зрения ползёт мёртвая полоса битых пикселей, а при резком перепаде света картинка на долю секунды рассыпается в цифровой снег." },
    { name: "Нейропорт и внешнее хранилище", text: "Стандартный слот у основания черепа для прямого подключения носителей. При увольнении служба безопасности корпорации выжгла из памяти Тигнари всё, что сочла своей интеллектуальной собственностью. В голове остались лишь пустые сектора, битые файлы и оборванные цепочки воспоминаний. Огромный пласт его прошлых открытий просто перестал существовать.\n\nТо немногое, что чудом уцелело или было по крупицам восстановлено позже, покоится на нескольких зашифрованных шардах: уникальные формулы, расчёты синтеза, протоколы «полевых испытаний». Это — главный капитал Тигнари." }

  setTimeout(()=>{ NOTE.g.visible=true; ROOTS.final=NOTE.g; pickables.push(NOTE.g); TAGEL.final.classList.add("avail"); toast("На столе что-то появилось."); glitch(.6); },6200); }

/* ================= ВВОД ================= */
const ray=new T.Raycaster(), ndc=new T.Vector2(), aim=new T.Vector2(0,-.1), mouse={x:0,y:0}; ray.params.Line.threshold=.004; ray.params.Points.threshold=.004;
const look={y:0,p:0}, lookT={y:0,p:0};

const cvs=renderer.domElement;
cvs.addEventListener("pointermove",e=>{ setNdc(e); isTouch=e.pointerType!=="mouse"; if(!isTouch){ mouse.x=ndc.x; mouse.y=ndc.y; aim.copy(ndc); } needPick=true;
  if(down&&isTouch){ const dx=e.clientX-down.x, dy=e.clientY-down.y; if(Math.abs(dx)+Math.abs(dy)>8) dragged=true; if(dragged){ lookT.y=clamp(down.ly+dx/innerWidth*2.2,-.75,.75); lookT.p=clamp(down.lp+dy/innerHeight*1.6,-.25,.62); aim.set(0,-.1); } } });

cvs.addEventListener("pointerup",e=>{ setNdc(e); const wd=dragged; down=null; dragged=false; if(wd) return; hint.classList.add("gone"); const h=pickAt(); if(mode==="overview"){ if(h) openItem(h.id); } else if(mode==="focus"&&game&&game.pick) game.pick(h); });

const uvBtn=$("#uvBtn"), motBtn=$("#motBtn"), soundBtn=$("#soundBtn");

  if(e.key==="Escape"){ if(mode==="modal") closeModal(); else if(mode==="focus") leaveFocus(); return; }

});

const fgEl=$("#fg");
(function(){ const fa=$("#fg .fa"), fb=$("#fg .fb"), fc=$("#fg .fc");
  let g=fa.getContext("2d"); g.fillStyle="#000302"; g.strokeStyle="#000302";

  const rr=rng(19); for(let i=0;i<16;i++){ const k=i/16; leaf(222-40*Math.sin(k*3),k*640,42+rr()*34,(i%2?-.8:3.9)+rr()*.6); } for(let i=0;i<9;i++) leaf(276-14*Math.sin(i),i*52+20,30+rr()*22,(i%2?-.6:3.8));

/* ================= КАДР ================= */
const EYE=V(0,.86,.98), BASE_P=-.72;
const cam={pos:EYE.clone(),yaw:0,pitch:BASE_P,roll:0}; const prevPos=V(0,0,0), tmp=V(0,0,0), tmp2=V(0,0,0), tmp3=V(0,0,0), fdir=V(0,0,0);
const shift={x:0,tx:0,r:0,tr:0,next:9}; const eul=new T.Euler(0,0,0,"YXZ"), ray2=new T.Raycaster();
let t=0, last=performance.now(), neonDip=0, dripNext=2.5, smearV=0, fovC=62;
const dirYP=d=>({y:Math.atan2(-d.x,-d.z),p:Math.asin(clamp(d.y,-1,1))});
function update(dt,now){
  t+=dt; runTweens(now); if(entered) breathTick(dt);
  // взгляд
  if(!isTouch){ lookT.y=-mouse.x*.34; lookT.p=mouse.y*.22+(mouse.y>.55?(mouse.y-.55)*.9:0); }
  const lk=1-Math.exp(-dt*2.6); look.y=lerp(look.y,lookT.y,lk); look.p=lerp(look.p,lookT.p,lk);
  shift.next-=dt; if(shift.next<=0){ shift.tx=(Math.random()-.5)*.05; shift.tr=(Math.random()-.5)*.024; shift.next=12+Math.random()*10; }
  shift.x=lerp(shift.x,shift.tx,Math.min(1,dt*.7)); shift.r=lerp(shift.r,shift.tr,Math.min(1,dt*.7));
  const m=motion?1:0, foc=mode!=="overview"&&current&&FOCUS[current];
  let gYaw,gPitch,gFov; if(foc){ const F=FOCUS[current]; tmp.copy(F.pos); const yp=dirYP(tmp2.copy(F.tgt).sub(F.pos).normalize()); gYaw=yp.y+look.y*.22; gPitch=yp.p+(look.p-.0)*.18; gFov=F.fov; } else { tmp.copy(EYE); tmp.x+=shift.x*m; gYaw=look.y; gPitch=BASE_P+look.p; gFov=62; }
  if(narrow()) gFov+=foc?14:12;
  const k=1-Math.exp(-dt*(foc?1.7:2.1));
  prevPos.copy(cam.pos); const py=cam.yaw, pp=cam.pitch;
  cam.pos.lerp(tmp,k); cam.yaw=lerp(cam.yaw,gYaw,k); cam.pitch=lerp(cam.pitch,gPitch,k); fovC=lerp(fovC,gFov,k);
  const spd=dt>0?cam.pos.distanceTo(prevPos)/dt:0, aspd=dt>0?(Math.abs(cam.yaw-py)+Math.abs(cam.pitch-pp))/dt:0;
  const b=breathY()-.5, tr1=Math.sin(t*1.7)*.6+Math.sin(t*3.13+1)*.4, tr2=Math.sin(t*1.31+2)*.6+Math.sin(t*2.71)*.4;
  camera.position.copy(cam.pos); camera.position.y+=(b*.012+Math.sin(t*8.5)*Math.min(spd,.6)*.014)*m; camera.position.x+=tr1*.0012*m;
  eul.set(cam.pitch+(b*.008+tr2*.0016)*m, cam.yaw+tr1*.0016*m, (shift.r+tr2*.0012)*m); camera.quaternion.setFromEuler(eul);
  if(Math.abs(camera.fov-fovC)>.01){ camera.fov=fovC; camera.updateProjectionMatrix(); }
  smearV=lerp(smearV,clamp(spd*.55+aspd*.03-.05,0,.6)*m,Math.min(1,dt*8));
  // передний план
  fgEl.style.transform="translate("+(look.y*170).toFixed(1)+"px,"+(-look.p*120+b*5*m).toFixed(1)+"px) scale("+(foc?1.25:1)+")"; fgEl.style.opacity=mode==="modal"?.25:(foc?.45:1);
  // выбор
  if(needPick&&mode!=="modal"){ needPick=false; const h=pickAt(); if(mode==="overview"){ hoverId=h?h.id:null; hoverHit=null; } else { hoverHit=h; hoverId=null; } }
  let sel=[], col="#9ff5d6";
  if(mode==="overview"&&hoverId){ sel=[ROOTS[hoverId]]; if(ITEMS[hoverId].decor) col="#c88ad8"; } else if(mode==="focus"&&game&&game.hl) sel=game.hl(hoverHit);
  if(outline){ outline.selectedObjects=sel; outline.visibleEdgeColor.set(col); }
  stageEl.classList.toggle("hov",sel.length>0&&mode!=="modal");
  // метки
  const Wd=innerWidth,Hd=innerHeight;
  Object.keys(TAGEL).forEach(id=>{ const el=TAGEL[id], it=ITEMS[id]; const show=mode==="overview"&&((hoverId===id)||(uvOn&&!it.decor&&el.classList.contains("avail"))); el.classList.toggle("show",show); if(!show) return; tmp2.copy(it.a).project(camera); const x=(tmp2.x+1)/2*Wd, y=(1-tmp2.y)/2*Hd; el.style.transform="translate("+x.toFixed(1)+"px,"+y.toFixed(1)+"px)"; el.classList.toggle("left",x>Wd-240); });
  // ультрафиолетовый фонарик
  const uvT=(uvOn||finalUV)?1:0; flash.userData.k=lerp(flash.userData.k||0,uvT,Math.min(1,dt*5)); const fk=flash.userData.k;
  ray2.setFromCamera(isTouch?aim:mouse,camera); fdir.copy(ray2.ray.direction);
  flash.position.copy(tmp3.set(.12,-.1,0).applyQuaternion(camera.quaternion).add(camera.position));
  flash.target.position.copy(camera.position).addScaledVector(fdir,2).add(tmp2.set(tr1*.006,tr2*.006,0));
  flash.intensity=4.4*fk*(.94+Math.random()*.06);
  fdir.copy(flash.target.position).sub(flash.position).normalize();
  MARKS.forEach(mk=>{ mk.m.getWorldPosition(tmp2); tmp2.sub(flash.position).normalize(); const cone=sstep(.9,.975,tmp2.dot(fdir)); let a=mk.fin?finalK:Math.max(fk*cone,finalK*.9); mk.m.material.opacity=a*(.88+Math.random()*.12); });
  MU.capMat.emissiveIntensity+=0; hemi.intensity=lerp(hemi.intensity,finalShown?.22:(uvOn?.4:.55),Math.min(1,dt*3));
  // свет за окном
  if(!finalShown){ if(neonDip>0){ neonDip-=dt; back.intensity=BACK_I*(Math.random()<.5?.3:.85); outMat.color.setScalar(1.4); } else { back.intensity=BACK_I; outMat.color.setScalar(2.6); if(!reduce&&Math.random()<dt*.12) neonDip=.1+Math.random()*.25; } }
  EMBER.light.intensity=.2+Math.random()*.1; EMBER.mesh.material.color.setRGB(4,1+Math.random()*.4,.3);
  R.led.visible=Math.sin(t*5)>0; EA.led.visible=EA.powered||Math.sin(t*6)>0;
  if(PH.state==="off") PH.scrMat.emissiveIntensity=Math.sin(t*4.5)>0?1:.1; else PH.scrMat.emissiveIntensity=1;
  const hf=R.heat/100; R.liqMat.emissiveIntensity=.9+hf*2.4+R.flash*4; R.light.intensity=1+hf*2.2+R.flash*3;
  if(R.temp!==R._lt){ R._lt=R.temp; R.lcd.upd(); }
  R.bubbles.forEach(bb=>{ const u=bb.userData; bb.visible=R.level>.03; u.y+=dt*u.v*(1+hf*3); if(u.y>1){ u.y=0; u.a=Math.random()*6.28; u.r=Math.random()*.07; } bb.position.set(Math.cos(u.a)*u.r,.075+u.y*(R.level-.008),Math.sin(u.a)*u.r); });
  VINES.forEach(v=>{ v.rotation.z=Math.sin(t*.35+v.userData.ph)*.025; v.rotation.x=Math.sin(t*.27+v.userData.ph*1.3)*.02; });
  const dp=dustG.attributes.position.array; for(let i=0;i<dustN;i++){ dp[i*3+1]-=dt*.004; dp[i*3]+=Math.sin(t*.25+i)*dt*.002; if(dp[i*3+1]<.01) dp[i*3+1]=.9; } dustG.attributes.position.needsUpdate=true;
  dustM.color.copy(C("#c8ffe8")).lerp(C("#e8a8ff"),fk*.6);
  EMBER.mesh.getWorldPosition(tmp2);
  SMK.forEach((s,i)=>{ const u=s.userData; u.life+=dt; if(u.life>u.max){ u.life=0; u.max=6+Math.random()*2; u.dx=(Math.random()-.5)*.06; } const kk=u.life/u.max; s.position.set(tmp2.x+u.dx*kk+Math.sin(t*.7+i)*.012*kk,tmp2.y+kk*.42,tmp2.z+u.dx*.5*kk); s.scale.setScalar(.012+kk*.13); s.material.opacity=Math.sin(Math.PI*kk)*.14; });
  for(let i=PFX.length-1;i>=0;i--){ const s=PFX[i], u=s.userData; u.life+=dt; const kk=u.life/u.max; if(kk>=1){ scene.remove(s); s.material.dispose(); PFX.splice(i,1); continue; } s.position.addScaledVector(u.v,dt); u.v.y+=u.add?-1.2*dt:.05*dt; s.material.opacity=(1-kk)*(u.add?1:.5); s.scale.setScalar(u.size*(1+kk*(u.add?0:3))); }
  // капли
  dripNext-=dt; if(dripNext<=0){ dripNext=2.2+Math.random()*3.5; DRIP.visible=true; DRIP.position.y=.78; tw(380,kk=>{ DRIP.position.y=lerp(.78,.002,kk); },()=>{ DRIP.visible=false; RIPPLE.material.opacity=.5; tw(900,kk=>{ RIPPLE.scale.setScalar(.004+kk*.05); RIPPLE.material.opacity=.5*(1-kk); },null,easeOut); const yw=Math.atan2(-.04,1.54); AU.drip(clamp(-Math.sin(yw-cam.yaw)*1.4,-1,1)); },easeIn); }
  // звук в пространстве
  if(AU.on){ const yw=.46, yu=-.49; AU.pan(AU.cityP,-Math.sin(yw-cam.yaw)*1.3,AU.cityG,(finalShown?.06:.12)+.1*Math.max(0,Math.cos(yw-cam.yaw))); AU.pan(AU.uvP,-Math.sin(yu-cam.yaw)*1.3); }
  // события и перемены за спиной
  if(entered){ EVT.next-=dt; if(EVT.next<=0&&mode!=="modal"){ fireEvent(); EVT.next=26+Math.random()*30; } }
  if(entered&&chIdx<CHANGES.length&&mode==="overview"){ chTimer-=dt; if(chTimer<=0){ const c=CHANGES[chIdx]; tmp2.copy(c.a).project(camera); const off=tmp2.z>1||Math.abs(tmp2.x)>1.08||Math.abs(tmp2.y)>1.08; if(off){ offT+=dt; if(offT>1.2){ c.fn(); chIdx++; chTimer=22+Math.random()*18; offT=0; } } else offT=0; } }
  if(PH.holo.visible){ PH.holo.lookAt(camera.position); if(Math.random()<.04) PH.holo.material.opacity=.3; else if(PH.holo.material.opacity<.85&&PH.state==="on") PH.holo.material.opacity=Math.min(.85,PH.holo.material.opacity+dt*3); PH.holo.position.y=.14+Math.sin(t*1.5)*.004; }
  if(NOTE.g.visible){ const ph=(t%1.8)/1.8; NOTE.ring.scale.setScalar(1+ph*.7); NOTE.ring.material.opacity=.8*(1-ph); }
  if(game&&game.update) game.update(dt);
  glitchV=Math.max(0,glitchV-dt*3);
}
function render(){ if(composer){ fin.uniforms.time.value=t; fin.uniforms.glitch.value=glitchV; fin.uniforms.smear.value=smearV; composer.render(); } else renderer.render(scene,camera); }
function loop(now){ const dt=clamp((now-last)/1000,0,.05); last=Math.max(last,now); update(dt,now); render(); requestAnimationFrame(loop); }
function resize(){ const w=innerWidth,h=innerHeight; renderer.setSize(w,h); camera.aspect=w/h; camera.updateProjectionMatrix(); if(composer){ composer.setSize(w,h); fin.uniforms.res.value.set(w*DPR,h*DPR); } }
window.addEventListener("resize",resize);
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>fontRedraw.forEach(f=>f()));
updateProgress();
requestAnimationFrame(loop);
})();
